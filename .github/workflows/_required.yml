name: Required Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: required-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forbid-suppressions:
    name: forbid-suppressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: "Reject silent-failure workaround in shell/YAML/Dockerfile/justfile/HCL"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files \
            -- \
            '*.sh' '*.bash' '*.yml' '*.yaml' '*.hcl' \
            'Dockerfile*' '**/Dockerfile*' \
            'justfile' '**/justfile' 'Justfile' '**/Justfile')
          declare -a scan_files=()
          for f in "${files[@]}"; do
            case "$f" in
              # Exempt this workflow file (heredoc would otherwise self-match)
              .github/workflows/_required.yml) continue ;;
              # Exempt any runbook that documents the rule (if present)
              docs/runbooks/no-silent-failures.md) continue ;;
            esac
            scan_files+=("$f")
          done
          if [ "${#scan_files[@]}" -eq 0 ]; then
            echo "No files to scan"
            exit 0
          fi
          if grep -nE '\|\|[[:space:]]*true([[:space:]]*$|[[:space:]]+#)' "${scan_files[@]}"; then
            echo ""
            echo '::error::Found silent-failure workarounds above. Refactor per HomericIntelligence/Odysseus#280.'
            exit 1
          fi
          echo 'OK: no silent-failure workarounds found'

      - name: "Reject continue-on-error workflow opt-out"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No workflow files"
            exit 0
          fi
          if grep -nE '^[[:space:]]*continue-on-error:[[:space:]]*true[[:space:]]*$' "${files[@]}"; then
            echo ""
            echo '::error::Found "continue-on-error: true" above. Fix the root cause per HomericIntelligence/Odysseus#280.'
            exit 1
          fi
          echo 'OK: no "continue-on-error: true" found'

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.70.2
          cache: true
      - name: Lint (ruff)
        run: pixi run ruff check src tests

      - name: Type-check (mypy)
        run: pixi run mypy src/telemachy --ignore-missing-imports

      - name: Lint YAML
        run: |
          pip install yamllint --quiet
          yamllint -c .yamllint.yaml .

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@8de2aa07cae85fd17c0b35642db70cf5495f1d25  # v20.0.0
        with:
          # markdownlint-cli2 does NOT read .markdownlintignore (that file
          # only applies to markdownlint-cli v1) — exclusions must be
          # negation globs here. Keep in sync with .markdownlintignore.
          globs: |
            **/*.md
            !.claude-followup-*.md
            !.claude-prompt-*.md
            !.pixi/**
          config: ".markdownlint.yaml"

  pixi-check:
    name: pixi-check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: lint
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Skip if no pixi.toml
        id: detect
        shell: bash
        run: |
          if [ ! -f pixi.toml ]; then
            echo "::notice::No pixi.toml in repo, skipping pixi-check"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup pixi
        if: steps.detect.outputs.skip == 'false'
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.70.2
          cache: true
      - name: pixi install (locked)
        if: steps.detect.outputs.skip == 'false'
        shell: bash
        run: |
          if [ -f pixi.lock ]; then
            pixi install --locked
          else
            echo "::warning::pixi.toml present but pixi.lock missing — running unlocked"
            pixi install
          fi

  justfile-check:
    name: justfile-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Skip if no justfile
        id: detect
        run: |
          if [ ! -f justfile ] && [ ! -f Justfile ]; then
            echo "::notice::No justfile in repo, skipping justfile-check"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install just
        if: steps.detect.outputs.skip == 'false'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: "1.36.0"
      - name: Validate justfile
        if: steps.detect.outputs.skip == 'false'
        run: |
          just --evaluate >/dev/null
          just --list >/dev/null

  symlink-check:
    name: symlink-check
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Run symlink check
        run: bash scripts/check-symlinks.sh

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.70.2
          cache: true
      - name: Run pytest
        run: pixi run pytest --tb=short -q --cov=telemachy --cov-report=term-missing --cov-fail-under=75

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.70.2
          cache: true
      - name: Validate workflow YAML files are well-formed
        run: |
          pixi run python -c "
          import yaml, glob, sys
          files = glob.glob('workflows/**/*.yaml', recursive=True) + glob.glob('workflows/**/*.yml', recursive=True)
          if not files:
              print('No workflow YAML files found — skipping validation')
              sys.exit(0)
          errors = []
          for f in files:
              try:
                  yaml.safe_load(open(f))
                  print(f'OK: {f}')
              except yaml.YAMLError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('FAILED:')
              for err in errors:
                  print(err)
              sys.exit(1)
          print(f'All {len(files)} workflow YAML file(s) are valid.')
          "
      - name: Validate workflow files against Telemachy schema
        # If schema export fails, fail loudly rather than silently
        # downgrading to YAML-parse-only — see #150.
        run: |
          set -euo pipefail
          if ! pixi run python -m telemachy.cli schema -o /tmp/telemachy-schema.json >/tmp/telemachy-schema.out 2>/tmp/telemachy-schema.err; then
            echo "::error::Schema export failed; refusing to fall back to YAML-parse-only."
            if [ -s /tmp/telemachy-schema.err ]; then
              cat /tmp/telemachy-schema.err >&2
            fi
            exit 1
          fi
          pip install check-jsonschema --quiet
          mapfile -t workflow_files < <(find workflows \( -name "*.yaml" -o -name "*.yml" \))
          if [ "${#workflow_files[@]}" -eq 0 ]; then
            echo "No workflow files to validate"
          else
            check-jsonschema --schemafile /tmp/telemachy-schema.json "${workflow_files[@]}"
          fi

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [unit-tests, integration-tests]
    permissions:
      contents: read
    steps:
      - name: Aggregate test gate
        run: |
          echo "All test suites (unit-tests, integration-tests) passed."
          echo "This canonical 'test' check aggregates the split suites for the ecosystem board."

  security-dependency-scan:
    name: security/dependency-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.70.2
          cache: true
      - name: Run pip-audit on project dependencies
        run: |
          pip install pip-audit --quiet
          pixi run python -c "
          import importlib.metadata, sys
          dists = importlib.metadata.distributions()
          lines = [f'{d.metadata[\"Name\"]}=={d.metadata[\"Version\"]}' for d in dists
                   if d.metadata.get('Name') and d.metadata.get('Version')]
          sys.stdout.write('\n'.join(lines) + '\n')
          " | grep -viE '^telemachy==' > /tmp/requirements-freeze.txt
          pip-audit -r /tmp/requirements-freeze.txt --skip-editable

  security-secrets-scan:
    name: security/secrets-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/')
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download"
          FILE="gitleaks_${GITLEAKS_VERSION}_${OS}_${ARCH}.tar.gz"
          curl -sSfL "${BASE_URL}/v${GITLEAKS_VERSION}/${FILE}" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run Gitleaks
        run: |
          if [ -f .gitleaks.toml ]; then
            gitleaks detect --source . --config .gitleaks.toml \
              --report-format sarif --report-path gitleaks.sarif
          else
            gitleaks detect --source . \
              --report-format sarif --report-path gitleaks.sarif
          fi

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 90

  security-sast-scan:
    name: security/sast-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.70.2
          cache: true
      - name: Run Bandit SAST scan (medium+ severity, emit JSON report)
        run: pixi run python -m bandit -ll --ini .bandit -r src/telemachy -f json -o bandit.json
      - name: Upload Bandit JSON report
        if: always() && hashFiles('bandit.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-report
          path: bandit.json
          retention-days: 90

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.70.2
          cache: true
      - name: Build distribution (hatchling)
        run: |
          pip install build hatchling --quiet
          python -m build --no-isolation
      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telemachy-dist-ci
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: build
    permissions:
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: telemachy-dist-ci
          path: dist/
      - name: Validate distribution metadata (twine check)
        run: |
          set -euo pipefail
          # packaging>=24.2 is required: hatchling emits a Metadata-Version 2.4
          # 'License-File' field, and packaging 24.0 (which twine 6.1.0 may
          # otherwise resolve) rejects it as a "malformed field 'license-file'".
          # 24.2 fixed that parser bug. See PEP 639.
          pip install twine 'packaging>=24.2' --quiet
          ls -la dist/
          twine check dist/*

  install:
    name: install
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: telemachy-dist-ci
          path: dist/
      - name: Install wheel in a clean venv and smoke-test
        run: |
          set -euo pipefail
          python -m venv /tmp/telemachy-install-venv
          # shellcheck disable=SC1091
          . /tmp/telemachy-install-venv/bin/activate
          pip install --upgrade pip --quiet
          # Telemachy is pixi-managed: runtime deps live in pixi.toml
          # [pypi-dependencies], not pyproject.toml [project.dependencies], so a
          # clean install must stage those runtime deps alongside the wheel to
          # reflect how the package is actually consumed. Derive them from
          # pixi.toml so this stays in sync with the source of truth.
          python - <<'PY' > /tmp/telemachy-runtime-reqs.txt
          import re, tomllib
          deps = tomllib.load(open("pixi.toml", "rb")).get("pypi-dependencies", {})
          for name, spec in deps.items():
              if name == "telemachy":
                  continue
              ver = spec if isinstance(spec, str) else spec.get("version", "*")
              # conda-style "*" means "any version" -> bare requirement for pip
              print(name if ver in ("*", "", None) else f"{name}{ver}")
          PY
          echo "Runtime requirements derived from pixi.toml:"
          cat /tmp/telemachy-runtime-reqs.txt
          pip install -r /tmp/telemachy-runtime-reqs.txt --quiet
          wheel=$(ls dist/*.whl)
          echo "Installing ${wheel} into clean venv"
          pip install --no-deps "${wheel}"
          # Import smoke test: the installed package is importable and exposes a version.
          python -c "import telemachy; print('telemachy', getattr(telemachy, '__version__', 'unknown'), 'importable'); import telemachy.cli"
          # CLI smoke test: the Typer app responds to --help (exits 0).
          python -m telemachy.cli --help

  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.70.2
          cache: true
      - name: Release dry-run (validate changelog + version contract, NO publish)
        run: |
          set -euo pipefail
          # This is a DRY-RUN gate that runs on every push/PR to main so the
          # ecosystem board has a live 'release' check-run. It validates the
          # release contract WITHOUT publishing. Actual publishing stays
          # tag-gated in release.yml (github-release + pypi-publish).
          pixi run python - <<'PY'
          import ast, pathlib, re, sys, tomllib

          errors = []

          # 1. pyproject.toml [project].version must be parseable.
          data = tomllib.load(open("pyproject.toml", "rb"))
          version = data["project"]["version"]
          print(f"pyproject.toml version: {version}")

          # 2. src/telemachy/__init__.py __version__ must agree (mirrors release.yml verify-version).
          init = pathlib.Path("src/telemachy/__init__.py").read_text()
          init_ver = None
          for node in ast.walk(ast.parse(init)):
              if isinstance(node, ast.Assign):
                  for t in node.targets:
                      if isinstance(t, ast.Name) and t.id == "__version__":
                          init_ver = ast.literal_eval(node.value)
          if init_ver is None:
              errors.append("src/telemachy/__init__.py has no __version__ assignment")
          elif init_ver != version:
              errors.append(f"__init__.py __version__ ({init_ver}) != pyproject.toml ({version})")
          else:
              print(f"__init__.py __version__ matches: {init_ver}")

          # 3. CHANGELOG.md must exist and carry a non-empty section the next
          #    release can publish from. On main (pre-tag) that is the
          #    'Keep a Changelog' [Unreleased] section; once a tag matching the
          #    current version is cut, a '## [<version>]' section is also valid.
          #    release.yml's github-release step slices '## [<tag-version>]' at
          #    publish time, so we only require a stageable section here — we do
          #    NOT require a versioned section for an unreleased version (that
          #    would make this dry-run red on every main commit).
          changelog = pathlib.Path("CHANGELOG.md")
          if not changelog.exists():
              errors.append("CHANGELOG.md is missing")
          else:
              text = changelog.read_text()
              section_pat = re.compile(
                  rf"^## \[(?:Unreleased|{re.escape(version)})\][^\n]*\n(.*?)(?=^## \[|\Z)",
                  re.MULTILINE | re.DOTALL,
              )
              m = section_pat.search(text)
              if not m:
                  errors.append(
                      "CHANGELOG.md has neither an '## [Unreleased]' nor a "
                      f"'## [{version}]' section — release notes cannot be staged"
                  )
              elif not m.group(1).strip():
                  errors.append(
                      "CHANGELOG.md release section is empty — nothing to publish"
                  )
              else:
                  print("CHANGELOG.md has a non-empty stageable release section")

          if errors:
              print("Release contract validation FAILED:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          print("Release dry-run OK: changelog + version contract valid (no publish performed).")
          PY

  schema-validation:
    name: schema-validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Validate GitHub Actions workflow YAML against JSON schema
        run: |
          pip install check-jsonschema --quiet
          find .github/workflows -name "*.yml" | \
            xargs check-jsonschema \
              --schemafile https://json.schemastore.org/github-workflow

  deps-version-sync:
    name: deps/version-sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.70.2
          cache: true
      - name: Verify pyproject.toml version is parseable and consistent
        run: |
          pixi run python -c "
          import ast, glob, pathlib, sys, tomllib

          # Source of truth: pyproject.toml [project].version
          data = tomllib.load(open('pyproject.toml', 'rb'))
          version = data['project']['version']
          print(f'pyproject.toml version: {version}')

          confirmations = 0

          # Optional VERSION file
          version_file = pathlib.Path('VERSION')
          if version_file.exists():
              file_ver = version_file.read_text().strip()
              if file_ver != version:
                  print(f'ERROR: VERSION file ({file_ver}) != pyproject.toml ({version})')
                  sys.exit(1)
              print(f'VERSION file matches: {file_ver}')
              confirmations += 1

          # Every src/**/__init__.py MUST expose __version__ matching pyproject.toml.
          # See #177: the previous 'if \"__version__\" in content' check silently
          # no-op'd when the symbol was absent, so the gate passed for the wrong reason.
          init_files = sorted(glob.glob('src/**/__init__.py', recursive=True))
          if not init_files and not version_file.exists():
              print('ERROR: no src/**/__init__.py and no VERSION file — '
                    'cannot verify version sync. See #177.')
              sys.exit(1)

          for init_file in init_files:
              tree = ast.parse(open(init_file).read())
              found = None
              for node in ast.walk(tree):
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name) and target.id == '__version__':
                              found = ast.literal_eval(node.value)
              if found is None:
                  print(f'ERROR: {init_file} has no top-level __version__ assignment. '
                        f'Define __version__ = \"{version}\" or add a VERSION file. See #177.')
                  sys.exit(1)
              if found != version:
                  print(f'ERROR: {init_file} __version__ ({found}) != pyproject.toml ({version})')
                  sys.exit(1)
              print(f'{init_file} __version__ matches: {found}')
              confirmations += 1

          print(f'Version sync OK ({confirmations} source(s) confirmed)')
          "
