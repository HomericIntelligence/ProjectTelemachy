name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5
        with:
          pixi-version: v0.67.0
          cache: true

      - name: Lint (ruff)
        run: pixi run ruff check src tests

      - name: Lint YAML files
        run: pixi run yamllint .

      - name: Type-check (mypy)
        run: pixi run mypy src/telemachy --ignore-missing-imports

      - name: Test (pytest)
        run: pixi run pytest --tb=short -q --cov=telemachy --cov-report=term-missing

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.18.1
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/')
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download"
          FILE="gitleaks_${GITLEAKS_VERSION}_${OS}_${ARCH}.tar.gz"
          curl -sSfL "${BASE_URL}/v${GITLEAKS_VERSION}/${FILE}" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run Gitleaks
        run: gitleaks detect --source . --exit-code 0
